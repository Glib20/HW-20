<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 1 та Завдання 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Завдання 1 -->
  <h2>Завдання 1: Галерея зображень</h2>
  <ul class="gallery">
    <li>
      <img class="image" src="https://images.pexels.com/photos/4617294/pexels-photo-4617294.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 1">
    </li>
    <li>
      <img class="image" src="https://images.pexels.com/photos/4617294/pexels-photo-4617294.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 2">
    </li>
    <li>
      <img class="image" src="https://images.pexels.com/photos/11815778/pexels-photo-11815778.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 3">
    </li>
    <li>
      <img class="image" src="https://images.pexels.com/photos/6195166/pexels-photo-6195166.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 4">
    </li>
    <li>
      <img class="image" src="https://images.pexels.com/photos/6957926/pexels-photo-6957926.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 5">
    </li>
    <li>
      <img class="image" src="https://images.pexels.com/photos/15520825/pexels-photo-15520825.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="зображення 6">
    </li>
  </ul>

  <div class="full-image-container">
    <img class="full-image" src="" alt="Повнорозмірне зображення">
  </div>

  <!-- Завдання 2 -->
  <h2>Завдання 2: Колекція елементів</h2>
  <div id="controls">
    <input type="number" min="0" max="100" step="1" placeholder="К-сть" />
    <button type="button" data-action="render">Створити</button>
    <button type="button" data-action="destroy">Очистити</button>
  </div>

  <div id="boxes"></div>

  <script src="script.js"></script>
</body>
</html>
